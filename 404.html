<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page not found</title>
  <meta name="description" content="The page you requested could not be found." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', stored || prefers);
      } catch (e) { /* noop */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .nf-wrap { max-width: 560px; margin: 18vh auto 0; padding: 0 1.5rem; text-align: center; }
    .nf-code { font-family: var(--font-serif, 'Source Serif 4', Georgia, serif); font-size: clamp(72px, 14vw, 132px); font-weight: 600; color: var(--accent); margin: 0 0 0.5rem; line-height: 1; }
    .nf-title { font-family: var(--font-serif, 'Source Serif 4', Georgia, serif); font-size: clamp(20px, 4vw, 28px); font-weight: 600; margin: 0 0 1rem; color: var(--text); }
    .nf-text { color: var(--text-muted); margin: 0 0 2rem; }
    .nf-link { display: inline-block; padding: 0.6rem 1.2rem; background: var(--accent); color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; transition: background 0.15s; }
    .nf-link:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main class="nf-wrap" id="main" tabindex="-1">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title">This page took a wrong turn.</h1>
    <p class="nf-text">The URL you requested doesn't exist on this site (yet).</p>
    <a class="nf-link" href="/">← Back to home</a>
  </main>
</body>
</html>
